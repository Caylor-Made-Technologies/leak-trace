name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Runs only on main, and only once the CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID repository secrets are added.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: dist
          path: dist
      - name: Deploy screenshot reader
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npm ci && npx wrangler deploy
      - name: Deploy app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: worker/node_modules/.bin/wrangler deploy
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy automatically."
